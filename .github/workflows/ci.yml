name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
        package: [., pure-cron, pure-guard]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package contents are what we expect (no stray files, no dependencies)
        shell: bash
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if (p.dependencies||p.devDependencies) { console.error('package must have zero dependencies'); process.exit(1) }"
